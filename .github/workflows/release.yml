name: Release

# Push a version tag (e.g. `git tag v0.1.1 && git push origin v0.1.1`) to build the
# desktop bundles and publish them as a GitHub Release:
#   macOS   — universal .dmg (Apple Silicon + Intel)
#   Windows — x64 .msi and .exe (NSIS) installers
on:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - run: npm ci

      # Whether the macOS signing secrets are configured. We must NOT pass empty
      # APPLE_* env vars to the build: the Tauri bundler treats a present-but-empty
      # APPLE_CERTIFICATE as "sign me" and then fails importing an empty cert. So we
      # branch on this and only attach the signing env when a certificate exists.
      - name: Detect macOS signing availability
        if: matrix.platform == 'macos-latest'
        id: mac_sign
        shell: bash
        run: echo "enabled=${{ secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build and publish (macOS — signed + notarized)
        if: matrix.platform == 'macos-latest' && steps.mac_sign.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application signing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (Apple ID + app-specific password).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Marginalia ${{ github.ref_name }}
          releaseBody: |
            Desktop builds for macOS (universal — Apple Silicon + Intel) and Windows (x64).

            - **macOS** — signed with a Developer ID certificate and notarized by Apple; it should open normally.
            - **Windows** — not yet code-signed, so SmartScreen may warn on first run: click **More info → Run anyway**. Signing is planned.
          releaseDraft: false
          prerelease: false

      # Unsigned path: Windows always, and macOS only if no signing secret is set.
      # No APPLE_* env is attached here, so the bundler never attempts to sign.
      # In production (signing enabled) this runs for Windows only; its release body
      # matches the signed-macOS step above so the notes are identical regardless of
      # which job writes the release first (macOS signed, Windows unsigned).
      - name: Build and publish (unsigned)
        if: matrix.platform == 'windows-latest' || (matrix.platform == 'macos-latest' && steps.mac_sign.outputs.enabled != 'true')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Marginalia ${{ github.ref_name }}
          releaseBody: |
            Desktop builds for macOS (universal — Apple Silicon + Intel) and Windows (x64).

            - **macOS** — signed with a Developer ID certificate and notarized by Apple; it should open normally.
            - **Windows** — not yet code-signed, so SmartScreen may warn on first run: click **More info → Run anyway**. Signing is planned.
          releaseDraft: false
          prerelease: false
