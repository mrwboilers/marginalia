name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build the
# universal macOS bundle and publish it as a GitHub Release with the .dmg attached.
on:
  push:
    tags: ['v*']

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust (Apple Silicon + Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Marginalia ${{ github.ref_name }}
          releaseBody: |
            macOS universal build (Apple Silicon + Intel). The app is unsigned, so
            on first launch run:

                xattr -dr com.apple.quarantine /Applications/Marginalia.app

            See the README for the full install steps.
          releaseDraft: false
          prerelease: false
